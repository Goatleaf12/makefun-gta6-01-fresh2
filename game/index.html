<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Port Vesper — 3D Open-World Harbor Action</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e16; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top { position: absolute; top: 14px; right: 16px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; color: #888; text-shadow: 0 2px 6px #000; }
  #money { font-size: 30px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 8px #000; }
  #objective { position: absolute; top: 14px; left: 16px; max-width: 46%; background: rgba(8,12,22,.72); border-left: 4px solid #ffd400; padding: 10px 14px; font-size: 15px; line-height: 1.45; border-radius: 4px; }
  #msg { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); background: rgba(8,12,22,.8); padding: 9px 18px; border-radius: 20px; font-size: 15px; transition: opacity .3s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #speed { position: absolute; bottom: 18px; right: 20px; font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px #000; }
  #minimap { position: absolute; bottom: 14px; left: 14px; border: 2px solid rgba(255,255,255,.35); border-radius: 8px; background: #0b1220; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #hint { position: absolute; bottom: 16px; left: 210px; font-size: 12px; color: rgba(255,255,255,.65); text-shadow: 0 1px 4px #000; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(255,255,255,.85); text-shadow: 0 0 6px #000; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(6,10,20,.82), rgba(20,8,24,.88)); color: #fff; z-index: 10; padding: 20px; }
  .overlay h1 { font-size: 64px; letter-spacing: 10px; margin: 0; color: #ffd400; text-shadow: 0 0 30px rgba(255,212,0,.5), 0 4px 0 #7a2d4a; }
  .overlay .tag { font-size: 18px; color: #9be8ff; margin: 10px 0 4px; }
  .overlay .sub { max-width: 560px; font-size: 15px; line-height: 1.6; color: #ddd; }
  .overlay button { margin-top: 22px; pointer-events: auto; cursor: pointer; background: #ffd400; color: #111; border: 0; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 14px 42px; border-radius: 6px; box-shadow: 0 6px 0 #a88600; }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a88600; }
  .overlay .controls { margin-top: 20px; font-size: 13px; color: #aaa; line-height: 1.7; }
  .overlay .save { font-size: 13px; color: #7dff8a; }
  #over-title { color: #ff3b30 !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Vesper: open-world harbor action game. Play as Nia Kessler, steal cars, run missions and evade the police."></canvas>
<p id="status" role="status" aria-live="polite">Port Vesper loading</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
